<!DOCTYPE html>
<html lang="en">

<head>
    <title>Reward</title>

    <!-- Mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background: linear-gradient(135deg, #ffd700, #fff3b0);
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .reward {
            margin-top: 120px;
            font-size: clamp(48px, 15vw, 64px);
            font-weight: bold;
        }

        .claim-btn {
            margin-top: 40px;
            font-size: 16px;
            padding: 14px 30px;
            width: 90%;
            max-width: 320px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="reward">100€</div>

    <form method="post">
        <button class="claim-btn" type="submit">CLAIM REWARD</button>
    </form>

</body>

</html>
