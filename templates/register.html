<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        input {
            display: block;
            margin: 12px auto;
            padding: 10px;
            width: 240px;
        }

        .error {
            color: red;
            font-size: 12px;
        }

        .box {
            margin-top: 80px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Create account</h2>

        <form method="post">
            <input type="text" name="phone" placeholder="Phone Number" onfocus="if(this.value==='') this.value='+';"
                oninput="if(this.value.charAt(0) !== '+') this.value='+';" required>

            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm" placeholder="Confirm Password" required>
            <input type="text" name="referral" placeholder="Referral Code" required>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <button type="submit">REGISTER</button>
        </form>
    </div>

</body>

</html>
