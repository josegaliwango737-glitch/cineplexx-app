<!DOCTYPE html>
<html lang="en">

<head>
    <title>Activity</title>

    <!-- Mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .back {
            display: inline-block;
            font-size: 14px;
            margin-bottom: 12px;
            text-decoration: none;
        }

        h3 {
            margin-top: 0;
        }

        .note {
            padding: 12px;
            margin-bottom: 10px;
            background: #f2f2f2;
            border-radius: 6px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <a class="back" href="{{ url_for('movies') }}">&lt; BACK</a>

    <h3>Activity</h3>

    {% if notifications %}
        {% for note in notifications %}
            <div class="note">{{ note }}</div>
        {% endfor %}
    {% else %}
        <div class="note">No activity yet</div>
    {% endif %}

</body>

</html>
