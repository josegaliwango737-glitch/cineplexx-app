<!DOCTYPE html>
<html lang="en">

<head>
    <title>More</title>

    <!-- Mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .top-section {
            min-height: 20vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f2f2f2;
            padding: 20px;
            box-sizing: border-box;
        }

        .account-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 8px;
            background: #ccc;
            border-radius: 50%;
            overflow: hidden;
        }

        .account-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .id {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .account-text {
            font-weight: bold;
            font-size: 14px;
        }

        .bottom-section {
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .option {
            padding: 14px 0;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="top-section">
        <div class="account-icon">
            <img src="{{ url_for('static', filename='account.png') }}">
        </div>
        <div class="id">ID: {{ user_id }}</div>
        <div class="account-text">ACCOUNT</div>
    </div>

    <div class="bottom-section">
        <div class="option">Manage Account</div>
        <div class="option">Service Center</div>
        <div class="option">Bonuses</div>
        <div class="option">Settings</div>
        <div class="option">Logout</div>
    </div>

</body>

</html>
