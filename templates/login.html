<!DOCTYPE html>
<html lang="en">

<head>
    <title>Cineplexx Login</title>

    <!-- THIS LINE IS THE MOST IMPORTANT FIX -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .logo-img {
            max-width: 240px;
            width: 70%;
            height: auto;
        }

        .login-box {
            margin-top: 40px;
        }

        input {
            display: block;
            margin: 12px auto;
            padding: 12px;
            width: 90%;
            max-width: 320px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            width: 90%;
            max-width: 320px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 12px;
        }

        .register {
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="logo">
        <img src="{{ url_for('static', filename='maincineplexxlogo2.png') }}" class="logo-img">
    </div>

    <div class="login-box">
        <form method="post">
            <input type="text" name="phone" placeholder="Phone Number"
                onfocus="if(this.value==='') this.value='+';"
                oninput="if(this.value.charAt(0) !== '+') this.value='+';"
                required>

            <input type="password" name="password" placeholder="Password" required>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <button type="submit">LOGIN</button>
        </form>
    </div>

    <div class="register">
        Create an account
        <a href="{{ url_for('register') }}">REGISTER</a>
    </div>

</body>

</html>
